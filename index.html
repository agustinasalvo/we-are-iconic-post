<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WE ARE ICONIC — Share Card Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0B1526;
    --ink-2: #0F1D33;
    --ivory: #F4EFE6;
    --limestone: #C9BFA9;
    --coral: #EF705D;
    --turquoise: #2EC4B6;
    --gold: #F7C45B;
    --emerald: #37A66B;
    --violet: #7257C8;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: #060B14;
    color: var(--ivory);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    padding: 28px 16px 60px;
  }
  .wrap{
    max-width: 980px;
    margin: 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 28px;
  }
  .heading{
    text-align:center;
  }
  .heading .eyebrow{
    font-size:.72rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color: var(--gold);
    margin:0 0 6px;
  }
  .heading h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    margin:0;
  }
  .heading p{
    color: var(--limestone);
    font-size:.9rem;
    margin: 8px 0 0;
    font-weight:300;
  }

  canvas{
    width: 100%;
    max-width: 480px;
    height: auto;
    border-radius: 14px;
    box-shadow: 0 30px 70px rgba(0,0,0,.55);
    background: var(--ink);
  }

  .panel{
    width:100%;
    max-width: 480px;
    background: rgba(244,239,230,0.04);
    border: 1px solid rgba(244,239,230,0.12);
    border-radius: 16px;
    padding: 24px;
    display:flex;
    flex-direction:column;
    gap: 18px;
  }

  .toggle{
    display:flex;
    border: 1px solid rgba(244,239,230,0.2);
    border-radius: 999px;
    padding: 4px;
    gap:4px;
  }
  .toggle button{
    flex:1;
    border:none;
    background:transparent;
    color: var(--limestone);
    font-family:'Inter',sans-serif;
    font-size:.82rem;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding: 10px 12px;
    border-radius: 999px;
    cursor:pointer;
    transition: all .25s ease;
  }
  .toggle button.active{
    background: linear-gradient(135deg, var(--coral), var(--violet));
    color: var(--ink);
    font-weight:600;
  }

  label{
    display:block;
    font-size:.7rem;
    letter-spacing:.15em;
    text-transform:uppercase;
    color: var(--limestone);
    margin-bottom: 6px;
  }
  input[type="text"]{
    width:100%;
    -webkit-appearance: none;
    appearance: none;
    background: #F4EFE6;
    border: 1px solid rgba(244,239,230,0.35);
    border-radius: 8px;
    padding: 12px 14px;
    color: #0B1526;
    font-family:'Inter',sans-serif;
    font-size: .95rem;
  }
  input[type="text"]:focus{
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }
  input[type="text"]::placeholder{ color: rgba(11,21,38,0.45); }

  input[type="range"]{
    width:100%;
    -webkit-appearance: none;
    appearance: none;
    accent-color: var(--gold);
    height: 6px;
    background: rgba(244,239,230,0.18);
    border-radius: 999px;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--gold);
    border: 2px solid var(--ink);
    cursor: pointer;
    margin-top: -8px;
  }
  input[type="range"]::-webkit-slider-runnable-track{
    height: 6px;
    background: rgba(244,239,230,0.18);
    border-radius: 999px;
  }

  .field{ display:flex; flex-direction:column; }

  .bg-actions{
    display:flex;
    gap:10px;
    margin-top:10px;
  }
  .secondary-btn{
    flex:1;
    background: rgba(114,87,200,0.14);
    border: 1px solid rgba(114,87,200,0.45);
    color: var(--ivory);
    padding: 10px 14px;
    border-radius: 8px;
    font-family:'Inter',sans-serif;
    font-size:.82rem;
    font-weight:600;
    letter-spacing:.03em;
    cursor:pointer;
  }
  .secondary-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
  }

  .upload{
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .upload-btn{
    background: rgba(247,196,91,0.12);
    border: 1px solid rgba(247,196,91,0.4);
    color: var(--gold);
    padding: 10px 16px;
    border-radius: 8px;
    font-size:.82rem;
    letter-spacing:.05em;
    cursor:pointer;
    white-space:nowrap;
  }
  .upload input[type="file"]{ display:none; }
  .upload-name{
    font-size:.78rem;
    color: var(--limestone);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .download-btn{
    margin-top: 4px;
    background: linear-gradient(135deg, var(--gold), var(--coral));
    color: var(--ink);
    border:none;
    padding: 14px 18px;
    border-radius: 10px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:.92rem;
    letter-spacing:.03em;
    cursor:pointer;
  }
  .download-btn:active{ transform: scale(.98); }

  .hint{
    font-size:.72rem;
    color: rgba(201,191,169,.65);
    text-align:center;
    font-style:italic;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="heading">
    <p class="eyebrow">Create your own LinkedIn post</p>
    <h1>WE ARE ICONIC — Share Card</h1>
    <p>Fill in your details, pick a version, and download your image to post on LinkedIn.</p>
  </div>

  <canvas id="card" width="1080" height="1350"></canvas>

  <div class="panel">
    <div class="toggle" id="modeToggle">
      <button data-mode="attendee" class="active">I'm attending</button>
      <button data-mode="speaker">I'm speaking</button>
    </div>

    <div class="field">
      <label for="nameInput">Full name</label>
      <input type="text" id="nameInput" value="Ana García" placeholder="Your name">
    </div>

    <div class="field">
      <label for="roleInput" id="roleLabel">Job title</label>
      <input type="text" id="roleInput" value="Product Lead" placeholder="Your title">
    </div>

    <div class="field">
      <label>Your photo</label>
      <div class="upload">
        <label class="upload-btn" for="photoInput">Choose photo</label>
        <input type="file" id="photoInput" accept="image/*">
        <span class="upload-name" id="photoName">No file chosen</span>
      </div>
      <div class="bg-actions" id="bgActions" style="display:none;">
        <button type="button" class="secondary-btn" id="removeBgBtn">Remove background</button>
        <button type="button" class="secondary-btn" id="undoBgBtn" style="display:none;">Undo</button>
      </div>
      <p class="hint" id="bgStatus" style="text-align:left; margin-top:8px;"></p>
    </div>

    <div class="field">
      <label for="zoomInput">Photo size</label>
      <input type="range" id="zoomInput" min="40" max="220" value="70">
    </div>

    <div class="field">
      <label for="posXInput">Photo horizontal position</label>
      <input type="range" id="posXInput" min="-400" max="400" value="0">
    </div>

    <button type="button" class="secondary-btn" id="flipBtn" style="margin-top:2px;">Flip photo horizontally</button>

    <div class="field">
      <label for="textScaleInput">Text size</label>
      <input type="range" id="textScaleInput" min="75" max="140" value="100">
    </div>

    <button class="download-btn" id="downloadBtn">Download image (PNG)</button>
    <p class="hint">Everything renders on your device — your photo is never uploaded anywhere.</p>
  </div>

</div>

<script>
const canvas = document.getElementById('card');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const COLORS = {
  ink: '#0B1526',
  ivory: '#F4EFE6',
  limestone: '#C9BFA9',
  coral: '#EF705D',
  turquoise: '#2EC4B6',
  gold: '#F7C45B',
  emerald: '#37A66B',
  violet: '#7257C8'
};
const RING_COLORS = [COLORS.coral, COLORS.turquoise, COLORS.gold, COLORS.emerald, COLORS.violet];

let state = {
  mode: 'attendee',
  name: 'Ana García',
  role: 'Product Lead',
  img: null,
  originalImg: null,
  photoZoom: 0.7,
  photoOffsetX: 0,
  flipX: false,
  textScale: 1
};

let fontsReady = false;
document.fonts.load('600 60px Fraunces').then(() => document.fonts.load('400 20px Inter')).then(() => {
  fontsReady = true;
  draw();
});

function wrapText(text, maxWidth, font){
  ctx.font = font;
  const words = text.split(' ');
  let lines = [];
  let current = '';
  for (const w of words){
    const test = current ? current + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && current){
      lines.push(current);
      current = w;
    } else {
      current = test;
    }
  }
  if (current) lines.push(current);
  return lines;
}

function drawBackground(){
  ctx.fillStyle = COLORS.ink;
  ctx.fillRect(0,0,W,H);

  function wash(x,y,r,color,alpha){
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, hexA(color, alpha));
    g.addColorStop(1, hexA(color, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  if (state.img){
    wash(140, 160, 680, COLORS.coral, 0.20);
    wash(W-100, 280, 600, COLORS.violet, 0.16);
    wash(W/2, H*0.5, 760, COLORS.gold, 0.12);
    wash(100, H-160, 560, COLORS.emerald, 0.12);
    wash(W-60, H-100, 520, COLORS.turquoise, 0.12);

    // photo, cover-fit, with user-controlled zoom, horizontal position, and flip
    const iw = state.img.width, ih = state.img.height;
    const scale = Math.max(W/iw, H/ih) * state.photoZoom;
    const w = iw*scale, h = ih*scale;
    const baseX = (W-w)/2 + state.photoOffsetX;
    const baseY = (H-h)/2;

    ctx.save();
    if (state.flipX){
      ctx.translate(baseX + w/2, 0);
      ctx.scale(-1, 1);
      ctx.translate(-(baseX + w/2), 0);
    }
    ctx.drawImage(state.img, baseX, baseY, w, h);
    ctx.restore();

    // dark gradient at top for text legibility
    const topG = ctx.createLinearGradient(0,0,0,H*0.62);
    topG.addColorStop(0, hexA(COLORS.ink, 0.88));
    topG.addColorStop(0.55, hexA(COLORS.ink, 0.38));
    topG.addColorStop(1, hexA(COLORS.ink, 0));
    ctx.fillStyle = topG;
    ctx.fillRect(0,0,W,H*0.62);

    // dark gradient at bottom for the name badge
    const botG = ctx.createLinearGradient(0,H*0.62,0,H);
    botG.addColorStop(0, hexA(COLORS.ink, 0));
    botG.addColorStop(0.55, hexA(COLORS.ink, 0.55));
    botG.addColorStop(1, hexA(COLORS.ink, 0.92));
    ctx.fillStyle = botG;
    ctx.fillRect(0,H*0.62,W,H*0.38);
  } else {
    // fallback identity wash before a photo is chosen
    wash(140, 160, 680, COLORS.coral, 0.20);
    wash(W-100, 280, 600, COLORS.violet, 0.16);
    wash(W/2, H*0.5, 760, COLORS.gold, 0.12);
    wash(100, H-160, 560, COLORS.emerald, 0.12);
    wash(W-60, H-100, 520, COLORS.turquoise, 0.12);
  }
}

function hexA(hex, alpha){
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function drawTopContent(){
  const leftX = 80;
  const ts = state.textScale;
  const fs = (n) => Math.round(n*ts);
  let y = fs(150);

  ctx.textAlign = 'left';

  if (state.mode === 'speaker'){
    const label = 'SPEAKER';
    const fontSize = fs(30);
    ctx.font = `800 ${fontSize}px Inter`;
    const padX = fs(30);
    const boxW = W - leftX - 40;
    const boxH = fs(64);
    roundRect(leftX, y, boxW, boxH, boxH/2);
    const g = ctx.createLinearGradient(leftX,0,leftX+boxW,0);
    g.addColorStop(0, COLORS.gold);
    g.addColorStop(1, COLORS.coral);
    ctx.fillStyle = g;
    ctx.fill();
    leftSpacedText(label, leftX+padX, y+boxH/2+fontSize*0.34, fontSize, `800 ${fontSize}px Inter`, COLORS.ink, 0.22);
    y += boxH + fs(44);
  }

  ctx.font = `500 ${fs(26)}px Inter`;
  ctx.fillStyle = COLORS.ivory;
  ctx.fillText("Let's meet at", leftX, y);

  y += fs(96);
  ctx.font = `700 ${fs(88)}px Fraunces`;
  ctx.fillStyle = COLORS.ivory;
  ctx.fillText('WE ARE', leftX, y);

  y += fs(96);
  const grad = ctx.createLinearGradient(leftX, 0, leftX+520*ts, 0);
  grad.addColorStop(0, COLORS.coral);
  grad.addColorStop(0.5, COLORS.gold);
  grad.addColorStop(1, COLORS.violet);
  ctx.font = `700 ${fs(88)}px Fraunces`;
  ctx.fillStyle = grad;
  ctx.fillText('ICONIC', leftX, y);

  y += fs(56);
  leftSpacedText('BARCELONA', leftX, y, fs(24), `500 ${fs(24)}px Fraunces`, COLORS.limestone, 0.22);

  y += fs(52);
  leftSpacedText('SEPT 25–27', leftX, y, fs(18), `600 ${fs(18)}px Inter`, COLORS.gold, 0.22);

  return y + fs(40);
}

function leftSpacedText(text, x, y, size, font, color, spacing){
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = 'left';
  let cx = x;
  text.split('').forEach(l => {
    ctx.fillText(l, cx, y);
    cx += ctx.measureText(l).width + size*spacing;
  });
}

function measureLeftSpaced(text, spacing, size){
  let total = 0;
  text.split('').forEach(l => { total += ctx.measureText(l).width + size*spacing; });
  return total - size*spacing;
}

function letterSpacedText(text, cx, y, size, font, color, spacing){
  ctx.font = font;
  ctx.fillStyle = color;
  const letters = text.split('');
  let widths = letters.map(l => ctx.measureText(l).width + size*spacing);
  let total = widths.reduce((a,b)=>a+b,0) - size*spacing;
  let x = cx - total/2;
  ctx.textAlign = 'left';
  letters.forEach((l,i) => {
    ctx.fillText(l, x, y);
    x += widths[i];
  });
  ctx.textAlign = 'center';
}

function measureSpaced(text, spacing, font){
  ctx.font = font;
  const size = parseInt(font.match(/\d+/)[0]);
  const letters = text.split('');
  let widths = letters.map(l => ctx.measureText(l).width + size*spacing);
  return widths.reduce((a,b)=>a+b,0) - size*spacing;
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawNameBadge(){
  const leftX = 80;
  const maxW = W - leftX*2;
  const ts = state.textScale;
  const fs = (n) => Math.round(n*ts);
  let y = H - fs(210);

  // name
  ctx.textAlign = 'left';
  ctx.fillStyle = COLORS.ivory;
  ctx.font = `600 ${fs(54)}px Fraunces`;
  const nameLines = wrapText(state.name || 'Your name', maxW, `600 ${fs(54)}px Fraunces`);
  let lastBaseline = y;
  nameLines.forEach(line => {
    ctx.textAlign = 'left';
    ctx.fillText(line, leftX, y);
    lastBaseline = y;
    y += fs(60);
  });

  // accent rule — a comfortable gap below the name's last line
  const ruleY = lastBaseline + fs(24);
  ctx.fillStyle = COLORS.gold;
  ctx.fillRect(leftX, ruleY, fs(46), Math.max(3,fs(4)));
  y = ruleY + fs(42);

  // role (job title) — always shown, for both attendee and speaker
  if (state.role){
    ctx.font = `italic 400 ${fs(30)}px Fraunces`;
    ctx.fillStyle = COLORS.limestone;
    const roleLines = wrapText(state.role, maxW, `italic 400 ${fs(30)}px Fraunces`);
    roleLines.forEach(line => { ctx.fillText(line, leftX, y); y += fs(38); });
  }
}

function draw(){
  if (!fontsReady) return;
  drawBackground();
  drawTopContent();
  drawNameBadge();
}

// --- wire up controls ---
const modeToggle = document.getElementById('modeToggle');
const roleLabel = document.getElementById('roleLabel');

modeToggle.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  [...modeToggle.children].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.mode = btn.dataset.mode;
  roleLabel.textContent = state.mode === 'speaker' ? 'Job title' : 'Job title';
  draw();
});

document.getElementById('nameInput').addEventListener('input', (e) => {
  state.name = e.target.value; draw();
});
document.getElementById('roleInput').addEventListener('input', (e) => {
  state.role = e.target.value; draw();
});
document.getElementById('zoomInput').addEventListener('input', (e) => {
  state.photoZoom = e.target.value / 100; draw();
});
document.getElementById('posXInput').addEventListener('input', (e) => {
  state.photoOffsetX = Number(e.target.value); draw();
});
document.getElementById('flipBtn').addEventListener('click', () => {
  state.flipX = !state.flipX; draw();
});
document.getElementById('textScaleInput').addEventListener('input', (e) => {
  state.textScale = e.target.value / 100; draw();
});

const photoInput = document.getElementById('photoInput');
const photoName = document.getElementById('photoName');
const bgActions = document.getElementById('bgActions');
const removeBgBtn = document.getElementById('removeBgBtn');
const undoBgBtn = document.getElementById('undoBgBtn');
const bgStatus = document.getElementById('bgStatus');

photoInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  photoName.textContent = file.name;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      state.img = img;
      state.originalImg = img;
      state.photoZoom = 0.7;
      state.photoOffsetX = 0;
      state.flipX = false;
      document.getElementById('zoomInput').value = 70;
      document.getElementById('posXInput').value = 0;
      bgActions.style.display = 'flex';
      undoBgBtn.style.display = 'none';
      bgStatus.textContent = '';
      draw();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// --- high-quality background removal, fully client-side ---
// Uses @imgly/background-removal (a real matting model built for this
// exact task) loaded on demand — nothing is uploaded to a server, the
// model just downloads once to your browser and caches after that.
let removeBackgroundFn = null;
async function getRemoveBackgroundFn(){
  if (!removeBackgroundFn){
    const mod = await import('https://esm.run/@imgly/background-removal');
    removeBackgroundFn = mod.removeBackground;
  }
  return removeBackgroundFn;
}

removeBgBtn.addEventListener('click', async () => {
  if (!state.originalImg) return;
  removeBgBtn.disabled = true;
  bgStatus.textContent = 'Removing background… first time can take 10–20s while the model loads.';
  try {
    const removeBackground = await getRemoveBackgroundFn();
    const blob = await removeBackground(state.originalImg.src);
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      state.img = img;
      undoBgBtn.style.display = 'inline-block';
      bgStatus.textContent = 'Background removed.';
      removeBgBtn.disabled = false;
      draw();
    };
    img.src = url;
  } catch (err){
    console.error('Background removal failed:', err);
    bgStatus.textContent = "Couldn't remove the background (" + (err && err.message ? err.message : 'unknown error') + "). Try again, or upload an already-cut-out photo.";
    removeBgBtn.disabled = false;
  }
});

undoBgBtn.addEventListener('click', () => {
  state.img = state.originalImg;
  undoBgBtn.style.display = 'none';
  bgStatus.textContent = '';
  draw();
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const filename = (state.name || 'iconic-barcelona').trim().toLowerCase().replace(/\s+/g,'-') + '-' + state.mode + '.png';

  canvas.toBlob((blob) => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }, 'image/png');
});

</script>
</body>
</html>
